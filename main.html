<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProxyRoundTable — Surf from anywhere · Proxy rotation dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0f1a;
      --bg-panel: #0f1625;
      --bg-card: #131c2e;
      --border: #1e2d4a;
      --border-soft: #162033;
      --surf: #06b6d4;
      --surf-dim: #0891b2;
      --wave: #22d3ee;
      --tide: #0e7490;
      --accent: #2dd4bf;
      --text: #e0f2fe;
      --text-dim: #7dd3fc;
      --glow-surf: rgba(6, 182, 212, 0.2);
      --glow-wave: rgba(34, 211, 238, 0.15);
      --radius: 14px;
      --radius-sm: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      background-image: radial-gradient(ellipse 120% 60% at 50% -20%, rgba(6, 182, 212, 0.08), transparent 60%);
    }
    .app { max-width: 960px; margin: 0 auto; padding: 1.5rem 1.25rem; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 1rem 0 1.5rem;
      border-bottom: 1px solid var(--border-soft);
      margin-bottom: 1.5rem;
    }
    .logo { font-weight: 700; font-size: 1.75rem; color: var(--surf); letter-spacing: 0.03em; }
    .tagline { font-size: 0.8rem; color: var(--text-dim); margin-top: 0.35rem; }
    .header-right { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .btn {
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      padding: 0.55rem 1rem;
      border: 1px solid var(--border);
      background: var(--bg-panel);
      color: var(--text);
      cursor: pointer;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
    }
    .btn:hover { border-color: var(--surf-dim); color: var(--wave); }
    .btn.primary { background: var(--tide); border-color: var(--surf); color: #fff; }
    .btn.primary:hover { box-shadow: 0 0 24px var(--glow-surf); }
    .btn.small { padding: 0.4rem 0.85rem; font-size: 0.85rem; }

    .hero {
      text-align: center;
      padding: 2rem 1.5rem;
      background: linear-gradient(180deg, var(--bg-card) 0%, transparent 100%);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      margin-bottom: 1.5rem;
    }
    .hero h1 { font-size: 1.5rem; font-weight: 700; color: var(--text); margin-bottom: 0.5rem; }
    .hero p { color: var(--text-dim); font-size: 0.95rem; }

    .stats-row { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1.25rem; }
    .stat-card {
      flex: 1;
      min-width: 130px;
      padding: 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
    }
    .stat-card .label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.3rem; }
    .stat-card .value { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; font-weight: 600; color: var(--wave); }
    .stat-card .value.dim { color: var(--text-dim); }

    .current-slot-card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .current-slot-card h2 { font-size: 0.85rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem; }
    .slot-display {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 0.75rem;
      background: var(--bg-panel);
      border-radius: var(--radius-sm);
      border-left: 4px solid var(--surf);
    }
    .slot-display .host { font-family: 'JetBrains Mono', monospace; font-size: 1rem; color: var(--wave); }
    .slot-display .meta { font-size: 0.85rem; color: var(--text-dim); }
    .badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 6px; font-size: 0.7rem; font-weight: 600; }
    .badge.region { background: var(--glow-surf); color: var(--surf); }
    .badge.healthy { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .badge.unhealthy { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    .strategy-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .strategy-row label { font-size: 0.85rem; color: var(--text-dim); }
    .strategy-row select {
      padding: 0.5rem 0.75rem;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius-sm);
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
    }
    .rotate-wrap { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .message { padding: 0.75rem 1rem; border-radius: var(--radius-sm); font-size: 0.9rem; margin-bottom: 1rem; }
    .message.info { background: rgba(6, 182, 212, 0.1); border: 1px solid var(--surf); color: var(--wave); }
    .message.success { background: rgba(34, 197, 94, 0.1); border: 1px solid #22c55e; color: #4ade80; }
    .message.error { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #f87171; }

    .list-card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .list-card h2 { font-size: 0.85rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem; }
    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid var(--border-soft);
      font-size: 0.88rem;
    }
    .list-item:last-child { border-bottom: none; }
    .list-item .val { font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; }
    .list-item .region { color: var(--surf); }
    .empty-state { padding: 1.25rem; text-align: center; color: var(--text-dim); font-size: 0.9rem; }

    .tabs { display: flex; gap: 0.25rem; margin-bottom: 1rem; }
    .tab {
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-panel);
      color: var(--text-dim);
      font-weight: 500;
      font-size: 0.88rem;
    }
    .tab.active { border-color: var(--surf); color: var(--surf); background: var(--glow-surf); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .event-log {
      max-height: 200px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--text-dim);
      padding: 0.5rem;
      background: var(--bg-panel);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-soft);
    }
    .event-log line { display: block; margin-bottom: 0.2rem; }
    .faq-item { padding: 0.75rem 0; border-bottom: 1px solid var(--border-soft); }
    .faq-item:last-child { border-bottom: none; }
    .faq-q { font-weight: 600; color: var(--text); margin-bottom: 0.25rem; font-size: 0.9rem; }
    .faq-a { font-size: 0.88rem; color: var(--text-dim); }
    footer { text-align: center; padding: 1.5rem 0; font-size: 0.78rem; color: var(--text-dim); }
